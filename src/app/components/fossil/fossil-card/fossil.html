<mat-card class="fossil-card" appearance="outlined">
  <button
    matIconButton
    class="fossil-card__add"
    [class.fossil-card__add--open]="menuOpen()"
    type="button"
    [attr.aria-label]="menuOpen() ? 'Menü schließen' : 'Kraftwerk hinzufügen'"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="fossil-menu"
    (click)="toggleMenu()"
  >
    <mat-icon>{{ menuOpen() ? 'close' : 'add' }}</mat-icon>
  </button>

  <mat-card-header class="fossil-card__header">
    <div mat-card-avatar class="fossil-card__avatar">
      <mat-icon>factory</mat-icon>
    </div>
    <mat-card-title>Fossil</mat-card-title>
    <mat-card-subtitle>Aktuelle Erzeugung</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="fossil-card__content">
    <p class="fossil-card__value">
      64,1 <span class="fossil-card__unit">kW</span>
    </p>
    <dl class="fossil-card__stats">
      <div class="fossil-card__stat">
        <dt>Heute</dt>
        <dd>389,7 kWh</dd>
      </div>
      <div class="fossil-card__stat">
        <dt>Anlagen</dt>
        <dd>1</dd>
      </div>
    </dl>

    @if (menuOpen()) {
      <div id="fossil-service" class="fossil-card__service">
        <app-fossil-service />
      </div>
    }
  </mat-card-content>
</mat-card>
